name: Practical 2 - Selenium and Docker Publish

on:
  push:
    branches: ["main"]
    paths:
      - "practical-2-selenium-testng/**"
      - ".github/workflows/practical-2.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "practical-2-selenium-testng/**"
      - ".github/workflows/practical-2.yml"

jobs:
  selenium-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practical-2-selenium-testng
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version
      - name: Run Selenium tests
        run: mvn --batch-mode clean test

  build-and-publish-docker:
    needs: selenium-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./practical-2-selenium-testng
          file: ./practical-2-selenium-testng/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:${{ github.sha }}
